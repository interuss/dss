version: "2"

run:
  timeout: 5m

formatters:
    enable:
        - gofmt
    exclusions:
        paths:
            - build/workspace
            - '.*\.gen\.go'

linters:
  default: none
  enable:
    - bodyclose
    - rowserrcheck
    - misspell
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
    - nilerr
    - noctx
    - testifylint
    - unconvert
    - reassign
    - predeclared
    - nolintlint
    - unparam
  exclusions:
      paths:
          - build/workspace
          - '.*\.gen\.go'
