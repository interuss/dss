syntax = "proto3";

package dss.raftstore.consensus;

option go_package = "github.com/interuss/dss/pkg/raftstore/consensus/proposalpb";

message Proposal {
  bytes id = 1;
  uint64 node_id = 2;
  sfixed64 timestamp_unix_nanos = 3;
  string request_type = 4;
  bytes value = 5;
  bool read_only = 6;
  bool compressed = 7;
}
