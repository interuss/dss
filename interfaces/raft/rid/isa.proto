syntax = "proto3";

package rid;

import "google/protobuf/timestamp.proto";
import "models.proto";

option go_package = "github.com/interuss/dss/pkg/pb/ridpb";

message IdentificationServiceArea {
    bytes id = 1;
    string url = 2;
    string owner = 3;
    string writer = 4;
    models.CellsVolume4D volume = 5;
}

// Operations

message CreateIdentificationServiceAreaOperation {
    IdentificationServiceArea isa = 1;
}

message UpdateIdentificationServiceAreaOperation {
    IdentificationServiceArea isa = 1;
    string version = 2;
}

message DeleteIdentificationServiceAreaOperation {
    bytes id = 1;
    string owner = 2;
    string version = 3;
}

// Repository requests

message GetISARepoCall {
    bytes id = 1;
}

message InsertISARepoCall {
    IdentificationServiceArea isa = 1;
}

message UpdateISARepoCall {
    IdentificationServiceArea isa = 1;
    string version = 2;
}

message DeleteISARepoCall {
    bytes id = 1;
    string version = 2;
}

message SearchISAsRepoCall {
    repeated uint64 cells = 1;
    google.protobuf.Timestamp earliest = 2;
    google.protobuf.Timestamp latest = 3;
}

message CountISAsRepoCall {}
