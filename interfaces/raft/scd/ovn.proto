syntax = "proto3";

package scd;

option go_package = "github.com/interuss/dss/pkg/scd/scdpb";

// OVN is an opaque version number. The OVNs generated by the DSS are carried in their raw form.
message OVN {
    oneof value {
        // `{uuid}_{uuid}`, as requested by USSs for operational intents.
        bytes uuids = 1;
        // Base64 encoded SHA-256 digest, as generated by the DSS.
        bytes digest = 2;
        // Any other OVN, verbatim.
        string text = 3;
    }
}
