syntax = "proto3";

package scd;

option go_package = "github.com/interuss/dss/pkg/pb/scdpb";

// OVN is an opaque version number.
message OVN {
    oneof value {
        // `{uuid}_{uuid}`, as requested by USSs for operational intents, in its raw form.
        bytes uuids = 1;
        // Any other OVN, verbatim.
        string text = 2;
    }
}
