syntax = "proto3";

package dss.raftstore.consensus;

import "google/protobuf/timestamp.proto";
import "aux_/aux_.proto";
import "rid/payload.proto";
import "scd/payload.proto";

option go_package = "github.com/interuss/dss/pkg/pb/raftpb";

message Proposal {
    bytes id = 1;
    uint64 node_id = 2;
    google.protobuf.Timestamp timestamp = 3;

    oneof payload {
        aux.Payload aux_payload = 4;
        rid.Payload rid_payload = 5;
        scd.Payload scd_payload = 6;
    }
}
