syntax = "proto3";

package aux;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/interuss/dss/pkg/aux_/auxpb";

message SaveOwnMetadata {
    string locality = 1;
    string public_endpoint = 2;
}

message GetDSSMetadata {}

message RecordHeartbeat {
    string locality = 1;
    string source = 2;
    google.protobuf.Timestamp timestamp = 3;
    google.protobuf.Timestamp next_heartbeat_expected_before = 4;
    string reporter = 5;
}
