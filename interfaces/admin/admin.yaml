openapi: 3.0.2
info:
  title: InterUSS DSS Admin API
  version: 0.1.0

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          description: Human-readable message indicating what error occurred and/or why.
          type: string

    RaftGroupName:
      description: >-
        Name of a Raft group of a DSS node, one per service (e.g., `aux`, `rid`, `scd`).
      type: string

    RaftNode:
      description: A DSS node in a Raft group.
      type: object
      required:
        - id
        - name
        - url
        - state
      properties:
        id:
          description: Identifier for the node within the Raft group.
          type: string
          example: "2213958870532660157"
        name:
          description: Name of the node, identical across all Raft groups.
          type: string
          example: uss2.instance1
        url:
          description: >-
            URL at which the other members of the Raft group send Raft messages to the node.
            Served by the Raft communication listener.
          type: string
          example: http://uss2.instance1.example.com:9500
        state:
          description: |-
            State of the node in the Raft group.

            * `waiting`: Node is not yet a member of the group. It waits to be added to a running group or to create a new one.

            * `member`: Node is a member of the group.

            * `removed`: Node was removed from the group. Its ID can never be added to the group again.
          type: string
          enum:
            - waiting
            - member
            - removed
          example: member

    CreateRaftGroupMemberParameters:
      description: >-
        Request to add another DSS node to a Raft group. This request is sent to a member of the group, which does not
        know the node to add yet: the client passes it as `node`, as returned by
        `GET /admin/v1/raft/groups/{group_name}/this_node` on the node to add.
      type: object
      required:
        - node
      properties:
        node:
          $ref: '#/components/schemas/RaftNode'
        replaces:
          description: >-
            ID of a node with the same name and in the `member` state that the node replaces, e.g. after it lost its data directory.
            Without it, adding a node whose name is already used by a member is rejected.
            The replaced member is not removed by this request: it must be removed once the node is added.
          type: string
          example: "5740029381146209443"

    CreateRaftGroupParameters:
      description: >-
        Request to create a Raft group with this DSS node as its only member.
        Used for bootstrapping a new Raft group, which is then joined by the other nodes one at a time.
      type: object
      required:
        - group_name
      properties:
        group_name:
          $ref: '#/components/schemas/RaftGroupName'

    RaftGroup:
      description: A Raft group, as known by this DSS node.
      type: object
      required:
        - group_name
        - cluster_id
        - leader_id
        - nodes
      properties:
        group_name:
          $ref: '#/components/schemas/RaftGroupName'
        cluster_id:
          description: Identifier for the Raft group within the cluster. Identical on all the members of the group.
          type: string
          example: "12638153115695167455"
        leader_id:
          description: Identifier for the current leader of the Raft group. Empty if unknown.
          type: string
          example: "4401297763280950187"
        nodes:
          description: >-
            Nodes that are or were members of the Raft group.
          type: array
          items:
            $ref: '#/components/schemas/RaftNode'

paths:
  /admin/v1/raft/groups/{group_name}/this_node:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Describe this DSS node in a Raft group
      description: >-
        Representation of this node within the specified group. It is available for every group that the
        node runs, including while the node waits to create or join it.
      operationId: getThisRaftNode
      tags: [ raft ]
      responses:
        '200':
          description: This DSS node is successfully described.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftNode'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups:
    post:
      summary: Create a new Raft group with this DSS node as its only member
      description: >-
        This DSS node must be waiting, i.e. not a member of a group with this name yet. The other nodes are then added
        to the group one at a time. The request returns once this DSS node is the leader of the new group.
      operationId: createRaftGroup
      tags: [ raft ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaftGroupParameters'
      responses:
        '200':
          description: The Raft group was created. It is returned with this DSS node as its only member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroup'
        '400':
          description: The request was not properly formed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This DSS node is not waiting, it is or was a member of a Raft group with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group of interest.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Retrieve the specified Raft group, as known by this DSS node
      operationId: getRaftGroup
      tags: [ raft ]
      responses:
        '200':
          description: Raft group information was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroup'
        '404':
          description: >-
            This DSS node has no Raft group with this name, e.g., `scd` when running without `--enable_scd`, or while
            still waiting to create or join one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    post:
      summary: Add a node to a Raft group, as a voter
      description: >-
        The request must be sent to a member of the group, and the node to add is another DSS node, which must be
        running and waiting: as soon as it is added, it counts in the quorum of the group. A node started with an empty
        data directory waits to be added. The request returns once the change is adopted by the group.
      operationId: createRaftGroupMember
      tags: [ raft ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaftGroupMemberParameters'
      responses:
        '200':
          description: The node was added. It is returned as a member of the Raft group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftNode'
        '400':
          description: The request was not properly formed, or adding the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members/{node_id}:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
      - name: node_id
        in: path
        required: true
        description: ID of the node to remove.
        schema:
          type: string
          example: "5740029381146209443"
    delete:
      summary: Remove a node from a Raft group
      description: >-
        The ID of the removed node is retired permanently: it can never be added again to the group.
        A voter cannot be removed if the group would be left with fewer than 3 voters.
        The request returns once the change is adopted by the group.
      operationId: deleteRaftGroupMember
      tags: [ raft ]
      responses:
        '204':
          description: The node was removed.
        '400':
          description: The node ID is invalid, or removing the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: raft
    description: Endpoints exposed by a DSS node for management of its Raft groups.
