openapi: 3.0.2
info:
  title: InterUSS DSS Admin API
  version: 0.1.0

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          description: Human-readable message indicating what error occurred and/or why.
          type: string

    RaftGroupName:
      description: >-
        Name of a Raft group of a DSS node, one per service (e.g., `aux`, `rid`, `scd`).
      type: string

    RaftNode:
      description: A DSS node in a Raft group.
      type: object
      required:
        - id
        - url
        - state
      properties:
        id:
          description: Identifier for the node within the Raft group.
          type: string
          example: "2213958870532660157"
        url:
          description: >-
            URL at which the other members of the Raft group send Raft messages to the node.
            Served by the Raft communication listener.
            It identifies the DSS node within the cluster and across all Raft groups.
          type: string
          example: http://uss2.instance1.example.com:9500
        state:
          description: |-
            State of the node in the Raft group.

            * `waiting`: Node is not yet a member of the group. It waits to be added to a running group or to create a new one.

            * `member`: Node is a member of the group.

            * `removed`: Node was removed from the group. Its ID can never be added to the group again.
          type: string
          enum:
            - waiting
            - member
            - removed
          example: member

    CreateRaftGroupMemberParameters:
      description: >-
        Request to add another DSS node to a Raft group. This request is sent to a member of the group, which reads the
        ID of the node to add from the node itself, at its URL.
      type: object
      required:
        - url
      properties:
        url:
          description: URL at which the members of the Raft group send Raft messages to the node to add.
          type: string
          example: https://0.db.interuss.example.com:9500

    CreateRaftGroupParameters:
      description: >-
        Request to create a Raft group with this DSS node as its only member.
        Used for bootstrapping a new Raft group, which is then joined by the other nodes one at a time.
      type: object
      required:
        - group_name
      properties:
        group_name:
          $ref: '#/components/schemas/RaftGroupName'

    RaftGroup:
      description: A Raft group, as known by this DSS node.
      type: object
      required:
        - group_name
        - cluster_id
        - leader_id
        - nodes
      properties:
        group_name:
          $ref: '#/components/schemas/RaftGroupName'
        cluster_id:
          description: Identifier for the Raft group within the cluster. Identical on all the members of the group.
          type: string
          example: "12638153115695167455"
        leader_id:
          description: Identifier for the current leader of the Raft group. Empty if unknown.
          type: string
          example: "4401297763280950187"
        nodes:
          description: >-
            Nodes that are or were members of the Raft group.
          type: array
          items:
            $ref: '#/components/schemas/RaftNode'

    EvictionParameters:
      description: >-
        Eviction parameters of a Raft group, applied to each of its entity types.
      type: object
      required:
        - ttl
      properties:
        ttl:
          description: >-
            Duration, as a Go duration string, after their end at which entities are expired. Must be positive.
          type: string
          example: 30m
        limit:
          description: Maximum number of entities evicted per entity type by a cleanup job, 0 for unlimited.
          type: integer
          format: int64
          minimum: 0
          default: 0

    EvictionConfig:
      description: >-
        Eviction settings of a Raft group, used by the cleanup jobs scheduled by its leader.
      type: object
      required:
        - interval
        - parameters
      properties:
        interval:
          description: >-
            Duration, as a Go duration string, after their end at which entities are expired. Must be positive.
          type: string
          example: 1h
        parameters:
          $ref: '#/components/schemas/EvictionParameters'

    EvictionState:
      description: Eviction settings of a Raft group and the last run of its cleanup jobs.
      type: object
      required:
        - config
      properties:
        config:
          $ref: '#/components/schemas/EvictionConfig'
        last_run:
          description: >-
            Time of the last successful cleanup job of the group, absent if none ran.
          type: string
          format: date-time
        disabled:
          description: >-
            Whether the scheduled cleanup jobs are disabled.
          type: boolean

    EvictionDisabled:
      description: Whether the scheduled cleanup jobs of a Raft group are disabled. The eviction settings are kept either way.
      type: object
      required:
        - disabled
      properties:
        disabled:
          type: boolean

    EvictionRunParameters:
      description: Parameters of a cleanup job run on demand.
      type: object
      properties:
        parameters:
          description: >-
            Eviction parameters of the job. When absent, the parameters of the eviction settings of the group are used.
          allOf:
            - $ref: '#/components/schemas/EvictionParameters'

    EntityEvictionCount:
      description: Number of entities of an entity type deleted by a cleanup job.
      type: object
      required:
        - type
        - count
      properties:
        type:
          description: Entity type, e.g. `isas`.
          type: string
          example: isas
        count:
          description: Number of entities deleted.
          type: integer
          format: int64
          example: 12

    EvictionRunResult:
      description: Result of a cleanup job run on demand.
      type: object
      required:
        - counts
      properties:
        counts:
          description: Number of entities deleted per entity type of the group, sorted by entity type.
          type: array
          items:
            $ref: '#/components/schemas/EntityEvictionCount'

paths:
  /admin/v1/raft/groups/{group_name}/this_node:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Describe this DSS node in a Raft group
      description: >-
        Representation of this node within the specified group. It is available for every group that the
        node runs, including while the node waits to create or join it.
      operationId: getThisRaftNode
      tags: [ group ]
      responses:
        '200':
          description: This DSS node is successfully described.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftNode'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups:
    post:
      summary: Create a new Raft group with this DSS node as its only member
      description: >-
        This DSS node must be waiting, i.e. not a member of a group with this name yet. The other nodes are then added
        to the group one at a time. The request returns once this DSS node is the leader of the new group.
      operationId: createRaftGroup
      tags: [ group ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaftGroupParameters'
      responses:
        '200':
          description: The Raft group was created. It is returned with this DSS node as its only member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroup'
        '400':
          description: The request was not properly formed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This DSS node is not waiting, it is or was a member of a Raft group with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group of interest.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Retrieve the specified Raft group, as known by this DSS node
      operationId: getRaftGroup
      tags: [ group ]
      responses:
        '200':
          description: Raft group information was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroup'
        '404':
          description: >-
            This DSS node has no Raft group with this name, e.g., `scd` when running without `--enable_scd`, or while
            still waiting to create or join one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    post:
      summary: Add a node to a Raft group, as a voter
      description: >-
        The request must be sent to a member of the group, and the node to add is another DSS node, which must be
        running and waiting: this member reads the ID of the node from the node itself, then adds it.
        A node started with an empty data directory waits to be added. The request returns once the change is adopted by the group.
      operationId: createRaftGroupMember
      tags: [ group ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaftGroupMemberParameters'
      responses:
        '200':
          description: The node was added. It is returned as a member of the Raft group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftNode'
        '400':
          description: The request was not properly formed, or adding the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The node at this URL is not waiting or does not run this Raft group in this cluster, or the URL is already
            used by another member of the group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The node cannot be reached at this URL, or this DSS node is not a member of the Raft group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members/{node_id}:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
      - name: node_id
        in: path
        required: true
        description: ID of the node to remove.
        schema:
          type: string
          example: "5740029381146209443"
    delete:
      summary: Remove a node from a Raft group
      description: >-
        The ID of the removed node is retired permanently: it can never be added again to the group.
        A voter cannot be removed if the group would be left with fewer than 3 voters.
        The request returns once the change is adopted by the group.
      operationId: deleteRaftGroupMember
      tags: [ group ]
      responses:
        '204':
          description: The node was removed.
        '400':
          description: The node ID is invalid, or removing the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/eviction:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Retrieve the eviction settings of a Raft group and the last run of its cleanup jobs
      operationId: getEvictionState
      tags: [ eviction ]
      responses:
        '200':
          description: >-
            The eviction state was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionState'
        '404':
          description: >-
            This DSS node has no Raft group with this name or the group does not support eviction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/eviction/config:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    put:
      summary: Replace the eviction settings of a Raft group
      description: >-
        The settings replace the previous ones as a whole. The request returns once the change is adopted by the group.
      operationId: putEvictionConfig
      tags: [ eviction ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvictionConfig'
      responses:
        '200':
          description: The eviction settings were replaced. They are returned as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionConfig'
        '400':
          description: >-
            The request was not properly formed, e.g. an invalid duration, a negative interval, a non-positive TTL or a negative limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            This DSS node has no Raft group with this name or the group does not support eviction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/eviction/disabled:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    put:
      summary: Disable or enable the scheduled cleanup jobs of a Raft group
      description: >-
        The eviction settings are kept. The request returns once the change is adopted by the group.
      operationId: putEvictionDisabled
      tags: [ eviction ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvictionDisabled'
      responses:
        '200':
          description: The scheduled cleanup jobs were disabled or enabled. The eviction state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionState'
        '400':
          description: >-
            The request was not properly formed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            This DSS node has no Raft group with this name or the group does not support eviction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/eviction/runs:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    post:
      summary: Run a cleanup job on a Raft group
      description: >-
        The job deletes the expired entities of every entity type of the group, according to the parameters given or to the eviction settings.
      operationId: createEvictionRun
      tags: [ eviction ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvictionRunParameters'
      responses:
        '200':
          description: The cleanup job was run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionRunResult'
        '400':
          description: >-
            The request was not properly formed, e.g. an invalid duration, a non-positive TTL or a negative limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            This DSS node has no Raft group with this name or the group does not support eviction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: group
    description: Endpoints exposed by a DSS node for management of its Raft groups.
  - name: eviction
    description: Endpoints exposed by a DSS node for the eviction of the expired entities of its Raft groups.
