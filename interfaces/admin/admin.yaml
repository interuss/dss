openapi: 3.0.2
info:
  title: DSS Admin API
  version: 0.1.0

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          description: Human-readable message indicating what error occurred and/or why.
          type: string

    RaftGroupName:
      description: Name of a Raft group of a DSS node, one per service.
      type: string
      enum:
        - aux
        - rid
        - scd

    RaftGroupMember:
      type: object
      required:
        - id
        - name
        - url
      properties:
        id:
          description: ID of the node in the Raft group, as a decimal string. It is generated by the node.
          type: string
          example: "2213958870532660157"
        name:
          description: Name of the node, its `--raft_node_name`. It is unique among the members of the Raft group.
          type: string
          example: dss1
        url:
          description: URL at which the other members of the Raft group reach the node.
          type: string
          example: http://dss1.example.com:9500

    CreateRaftMemberRequest:
      description: >-
        Request to add a node to a Raft group. The node is described by `member`, with the ID, name and URL returned by
        its `GET /admin/v1/raft/groups/{group_name}/this_node`.
      type: object
      required:
        - member
      properties:
        member:
          $ref: '#/components/schemas/RaftGroupMember'
        replaces:
          description: >-
            ID of a member with the same name that the node replaces, e.g. after it lost its data directory.
            Without it, adding a node whose name is already used by a member is rejected.
            The replaced member is not removed by this request: it must be removed once the node is added.
          type: string
          example: "5740029381146209443"

    RaftNode:
      type: object
      required:
        - id
        - name
        - url
        - cluster_id
        - state
      properties:
        id:
          description: ID of this DSS node in the Raft group, as a decimal string.
          type: string
          example: "2213958870532660157"
        name:
          description: Name of this DSS node, its `--raft_node_name`.
          type: string
          example: dss1
        url:
          description: URL at which the other members of the Raft group reach this DSS node.
          type: string
          example: http://dss1.example.com:9500
        cluster_id:
          description: ID of the Raft group within the cluster, as a decimal string. It is identical on all the members of the group.
          type: string
          example: "12638153115695167455"
        state:
          description: >-
            State of this DSS node in the Raft group:
              * `waiting`: the node is not a member of the group yet. It waits to be added to a running group or to bootstrap a new one.
              * `member`: the node is a member of the group.
              * `removed`: the node was removed from the group.
          type: string
          enum:
            - waiting
            - member
            - removed
          example: member

    ListRaftMembersResponse:
      type: object
      required:
        - this_node_id
        - leader_id
        - members
        - removed_ids
      properties:
        this_node_id:
          description: ID of this DSS node in the Raft group, as a decimal string.
          type: string
          example: "2213958870532660157"
        leader_id:
          description: ID of the current leader of the Raft group, as a decimal string, empty if unknown.
          type: string
          example: "4401297763280950187"
        members:
          description: Members of the Raft group, all of which are voters.
          type: array
          items:
            $ref: '#/components/schemas/RaftGroupMember'
        removed_ids:
          description: IDs of the nodes removed from the Raft group, which can never be added again to it.
          type: array
          items:
            type: string
          example: ["5740029381146209443"]

paths:
  /admin/v1/raft/groups/{group_name}/this_node:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Describes this DSS node in a Raft group.
      description: >-
        A node joining a running group is added with the values returned here.
      operationId: getRaftNode
      tags: [ dss ]
      responses:
        '200':
          description: This DSS node is successfully described.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftNode'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/admin/v1/raft/groups/{group_name}:bootstrap':
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    post:
      summary: Bootstraps a new Raft group with this DSS node as its only member.
      description: >-
        This DSS node must be waiting, i.e. not a member of any group yet. The other nodes are then added to the group
        one at a time. The request returns once this DSS node is the leader of the new group.
      operationId: bootstrapRaftGroup
      tags: [ dss ]
      responses:
        '200':
          description: The Raft group was bootstrapped. This DSS node is returned as its only member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroupMember'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This DSS node is not waiting, it is or was a member of a Raft group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
    get:
      summary: Lists the members of a Raft group, as known by this DSS node.
      operationId: listRaftMembers
      tags: [ dss ]
      responses:
        '200':
          description: The members of the Raft group are successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRaftMembersResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Adds a node to a Raft group, as a voter.
      description: >-
        The node must be running and waiting before being added: as soon as it is added, it counts in the quorum of
        the group. A node started with an empty data directory waits to be added. The request must be sent to a member
        of the group, and returns once the change is applied by this DSS node.
      operationId: addRaftMember
      tags: [ dss ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRaftMemberRequest'
      responses:
        '200':
          description: The node was added. It is returned as a member of the Raft group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaftGroupMember'
        '400':
          description: The request was not properly formed, or adding the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/v1/raft/groups/{group_name}/members/{node_id}:
    parameters:
      - name: group_name
        in: path
        required: true
        description: Name of the Raft group.
        schema:
          $ref: '#/components/schemas/RaftGroupName'
      - name: node_id
        in: path
        required: true
        description: ID of the node to remove, as a decimal string.
        schema:
          type: string
          example: "5740029381146209443"
    delete:
      summary: Removes a node from a Raft group.
      description: >-
        The ID of the removed node is retired permanently: it can never be added again to the group.
        A voter cannot be removed if the group would be left with fewer than 3 voters.
        The request returns once the change is applied by this DSS node.
      operationId: removeRaftMember
      tags: [ dss ]
      responses:
        '204':
          description: The node was removed.
        '400':
          description: The node ID is invalid, or removing the node would lead to an invalid membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: This DSS node has no Raft group with this name, e.g. `scd` when it runs without `--enable_scd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: dss
    description: Endpoints exposed by the DSS server.
