# See values.schema.json for schema description

dss:
  image: docker.io/interuss/dss:v0.15.0 # See https://hub.docker.com/r/interuss/dss/tags for official image releases.
  # When running local images in minikube, uncomment the following line
  # imagePullPolicy: Never
  conf:
    pubKeys:
      - /test-certs/auth2.pem
    jwksEndpoint: ''
    jwksKeyIds: []
    jwksRefreshInterval: ''
    jwksKeyTtl: ''
    hostname: dss.example.com
    publicEndpoint: https://dss.example.com
    enableScd: true
    enableScdGlobalLock: false
    enableTimeBasedNotificationIndex: false
    enableDssMetrics: false
    locality: zone=interuss-example-google-ew1
    datastoreMaxOpenConns: 4

cockroachdb:
  enabled: true
  # See https://github.com/cockroachdb/helm-charts/blob/master/cockroachdb-legacy/values.yaml
  image:
    tag: v24.1.3
  fullnameOverride: dss-cockroachdb
  conf:
    join: []
    cluster-name: interuss-example
    single-node: false

  statefulset:
    replicas: 3 # Must match the number of .loadBalancers.cockroachdbNodes items.
    args:  # Remove this whole block for minikube
      - --locality-advertise-addr=zone=interuss-example-google-ew1@$(hostname -f)
      - --advertise-addr=${HOSTNAME##*-}.db.example.com
    updateStrategy:
      rollingUpdate:
        partition: 0 # Used for migrations. See /deploy/MIGRATIONS.md#helm-deployment-notes

  storage:
    persistentVolume:
      storageClass: standard

yugabyte:
  enabled: false
  # See https://github.com/yugabyte/charts/blob/master/stable/yugabyte/values.yaml

  gflags:
    master:
      placement_cloud: "cloud-1"
      placement_region: "uss-1"
      placement_zone: "zone-1"
    tserver:
      placement_cloud: "cloud-1"
      placement_region: "uss-1"
      placement_zone: "zone-1"

  # If you join a yugabyte cluster, set the masterAddresses there
  # masterAddresses: "yb-master-0.yb-masters.default.svc.cluster.local:7100,yb-master-1.yb-masters.default.svc.cluster.local:7100,yb-master-2.yb-masters.default.svc.cluster.local:7100"

# To deploy with the Raft-based datastore instead of CockroachDB/Yugabyte, set
# raft.enabled to true and disable both cockroachdb.enabled and yugabyte.enabled.
# Exactly one datastore backend must be enabled. The DSS nodes are then deployed
# as a StatefulSet with one PVC per node (Raft WAL and snapshots).
raft:
  enabled: false
  replicas: 3  # Number of DSS nodes (Raft voters). Must be odd for a useful quorum (2n+1).
  # nodeIDBase: 1  # Raft node ID of pod 0 (pod N is nodeIDBase + N). Never change after bootstrap.
  # clusterID: 1   # Same value on every node of the pool; different from other reachable pools.
  # datadir: /raft_data
  # ports:
  #   aux: 9031
  #   rid: 9011
  #   scd: 9021
  # storage:
  #   size: 100Gi
  #   storageClass: standard  # Low fsync latency recommended (commit path writes the WAL).
  # resources:
  #   requests:
  #     cpu: 1
  #     memory: 4Gi
  #   limits:
  #     cpu: 4
  #     memory: 16Gi
  # tuning: {}  # e.g. { "raft_tick_interval": "200ms" }

loadBalancers:
  cockroachdbNodes:
    - ip: 192.168.0.21
#      subnet: subnet-xxx # for aws only
    - ip: 192.168.0.22
#      subnet: subnet-xxx # for aws only
    - ip: 192.168.0.23
#      subnet: subnet-xxx # for aws only
  yugabyteMasterNodes:
    - ip: 192.168.0.31
#      subnet: subnet-xxx # for aws only
    - ip: 192.168.0.32
#      subnet: subnet-xxx # for aws only
    - ip: 192.168.0.33
#      subnet: subnet-xxx # for aws only
  dssGateway:
    ip: 192.168.0.10
#    subnet: subnet-xxx # for aws only
#    certName: arn:xxxx # for aws only

global:
  cloudProvider: google

monitoring:  # Set to true to enable monitoring stack
  enabled: true
  externalService:
    enabled: false  # Set this to true to expose prometheus on a public endpoint
    ip: ""  # IP used to expose the service (same behaviour as loadBalancers' IP field)
    subnet: ""  # AWS only (same behaviour as loadBalancers' subnet field)

prometheus:
  server:
    persistentVolume:
      storageClass: standard  # If you need a specfic storage class, set it there

grafana:
  persistence:
    storageClassName: standard  # If you need a specfic storage class, set it there
