{{- $cloudProvider := $.Values.global.cloudProvider}}

{{- if $.Values.raft.enabled }}
{{- $raft := .Values.raft -}}
{{- $nodes := $raft.nodes | default list -}}
{{- /* On AWS the pinning handle is the EIP allocation ID, not the endpoint address. */}}
{{- if eq $cloudProvider "aws" -}}
{{- range $i, $node := $nodes -}}
  {{- $aws := $node.awsLB | default dict -}}
  {{- if not $aws.eipAllocationId -}}
    {{- fail (printf "raft.nodes[%d] (id %d): awsLB.eipAllocationId is required on AWS: the EIP allocation ID of the address the node's endpoint %q resolves to" $i (int $node.id) $node.endpoint) -}}
  {{- end -}}
{{- end -}}
{{- end -}}

{{- range $i, $node := $nodes }}
  {{- $aws := $node.awsLB | default dict -}}
  {{- $ip := $node.ip -}}
  {{- if eq $cloudProvider "aws" -}}
    {{- $ip = $aws.eipAllocationId -}}
  {{- end }}
  {{- $port := index (splitList ":" $node.endpoint) 1 -}}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
    {{- include (printf "%s-lb-crdb-annotations" $cloudProvider)
      (dict
        "name" (printf "%s-%s" "raft-external-node" ( $i | toString) )
        "ip" $ip
        "subnet" ($aws.subnet | default "")
        "cloudProvider" $cloudProvider
      ) | nindent 4
    }}
  labels:
    app: {{$.Release.Name}}-core-service
    name: {{$.Release.Name}}-raft-external-node-{{$i}}
  name: {{$.Release.Name}}-raft-external-node-{{$i}}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- include (printf "%s-lb-spec" $cloudProvider) (dict "ip" $ip) | nindent 2}}
  ports:
    - name: {{$.Release.Name}}-raft-external-node-{{$i}}
      port: {{ $port }}
      targetPort: {{ $port }}
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: {{$.Release.Name}}-core-service-{{$i}}
  type: LoadBalancer
{{ end }}
{{- end }}
