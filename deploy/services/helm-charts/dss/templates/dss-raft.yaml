{{- if .Values.raft.enabled }}
{{- $dss := .Values.dss -}}
{{- $raft := .Values.raft -}}
{{- $datadir := "/raft_data" -}}
{{- $nodes := $raft.nodes | default list -}}
{{- if not $nodes -}}
  {{- fail "raft.nodes must list at least one node" -}}
{{- end -}}
{{- if not $raft.tlsSecret -}}
  {{- fail "raft.tlsSecret is required: the Raft listeners authenticate with mutual TLS" -}}
{{- end -}}

{{- $endpoints := list -}}
{{- $ports := list -}}
{{- range $i, $node := $nodes -}}
  {{- if contains "://" $node.endpoint -}}
    {{- fail (printf "raft node %d: endpoint %q must not include a scheme" $i $node.endpoint) -}}
  {{- end -}}
  {{- if ne (len (splitList ":" $node.endpoint)) 2 -}}
    {{- fail (printf "raft node %d: endpoint %q must be host:port" $i $node.endpoint) -}}
  {{- end -}}
  {{- $endpoints = append $endpoints $node.endpoint -}}
  {{- $ports = append $ports (index (splitList ":" $node.endpoint) 1 | int) -}}
{{- end -}}

{{- if ne (len $endpoints) (len (uniq $endpoints)) -}}
  {{- fail "duplicate endpoints in raft.nodes" -}}
{{- end -}}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    name: {{.Release.Name}}-core-service
  name: {{.Release.Name}}-core-service
  namespace: {{ $.Release.Namespace }}
spec:
  podManagementPolicy: Parallel
  minReadySeconds: 30
  replicas: {{ len $nodes }}
  selector:
    matchLabels:
      app: {{.Release.Name}}-core-service
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-core-service
      {{ if $dss.conf.enableDssMetrics }}
      annotations:
        prometheus.io/path: metrics
        prometheus.io/port: '8079'
        prometheus.io/scrape: 'true'
      {{ end }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{.Release.Name}}-core-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: core-service
          command:
            - sh
            - -c
          args:
            - |
              # Raft endpoints of this release's nodes, in pod-ordinal order.
              endpoints="{{ join " " $endpoints }}"
              ordinal=$(( ${HOSTNAME##*-} + 1 ))
              exec core-service \
            {{- range splitList "\n" (include "core-service-args" $) }}
                {{ . | squote }} \
            {{- end }}
                --store_type=raft \
                --raft_peer_url="https://$(printf '%s\n' $endpoints | sed -n "${ordinal}p")" \
                --raft_cluster_id={{ $raft.clusterID }} \
                --raft_datadir={{ $datadir }} \
                --raft_tls_cert_file="/raft-tls/node.raft-${HOSTNAME##*-}.crt" \
                --raft_tls_key_file="/raft-tls/node.raft-${HOSTNAME##*-}.key" \
                --raft_tls_ca_file=/raft-tls/ca.crt \
          image: {{ $dss.image }}
          imagePullPolicy: {{ $dss.imagePullPolicy | default "Always" }}
          {{- with $dss.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
            {{ if $dss.conf.enableDssMetrics }}
            - containerPort: 8079
              name: metrics
            {{ end }}
            {{- range ($ports | uniq) }}
            - containerPort: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
          {{- if or $dss.cpuRequest $dss.memoryRequest $dss.cpuLimit $dss.memoryLimit }}
          resources:
            {{- if or $dss.cpuRequest $dss.memoryRequest }}
            requests:
              {{- with $dss.cpuRequest }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $dss.memoryRequest }}
              memory: {{ . | quote }}
              {{- end }}
            {{- end }}
            {{- if or $dss.cpuLimit $dss.memoryLimit }}
            limits:
              {{- with $dss.cpuLimit }}
              cpu: {{ . | quote }}
              {{- end }}
              {{- with $dss.memoryLimit }}
              memory: {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          stdin: false
          tty: false
          volumeMounts:
            - mountPath: {{ $datadir }}
              name: raft-data
            - mountPath: /raft-tls
              name: raft-tls
              readOnly: true
            {{- if $raft.automaticBootstrap }}
            - mountPath: /run/dss
              name: admin-socket
            {{- end }}
            {{- if $dss.conf.pubKeys }}
            {{- include "public-certs:volumeMount" (dict "cockroachdbEnabled" false) | nindent 12 }}
            {{- end }}
        {{- if $raft.automaticBootstrap }}
        - name: raft-bootstrapper
          command:
            - sh
            - -c
          args:
            - |
              trap 'exit 0' TERM
              if [ "${HOSTNAME##*-}" != "0" ]; then
                sleep infinity &
                wait
              fi
              until dssctl raft node > /dev/null 2>&1; do
                sleep 5 &
                wait
              done
              for group in aux rid scd; do
                until dssctl raft node --groups "${group}" | grep -q ': member'; do
                  dssctl raft bootstrap --groups "${group}" || sleep 5
                done &
              done
              wait
              endpoints="{{ join " " (concat (rest $endpoints) ($raft.automaticBootstrapNodes | default list)) }}"
              while :; do
                pending=""
                for endpoint in ${endpoints}; do
                  for group in aux rid scd; do
                    if ! dssctl raft list --groups "${group}" | grep -qF "https://${endpoint} "; then
                      pending="${pending} ${endpoint}"
                      break
                    fi
                  done
                done
                if [ -z "${pending}" ]; then
                  break
                fi
                endpoints="${pending}"
                reachable=$(
                  for endpoint in ${pending}; do
                    (
                      curl -sk --max-time 1 -o /dev/null "https://${endpoint}"
                      case $? in
                        6|7|28) ;;
                        *) echo "${endpoint}" ;;
                      esac
                    ) &
                  done
                  wait
                )
                for endpoint in ${reachable}; do
                  echo "${endpoint} reachable, adding it"
                done
                for group in aux rid scd; do
                  (
                    for endpoint in ${reachable}; do
                      if ! dssctl raft list --groups "${group}" | grep -qF "https://${endpoint} "; then
                        dssctl raft add --groups "${group}" --url "https://${endpoint}"
                      fi
                    done
                  ) &
                done
                wait
                sleep 5 &
                wait
              done
              echo "Bootstrapping complete"
              sleep infinity &
              wait
          image: {{ $dss.image }}
          imagePullPolicy: {{ $dss.imagePullPolicy | default "Always" }}
          volumeMounts:
            - mountPath: /run/dss
              name: admin-socket
        {{- end }}
      {{- with $.Values.dss.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: raft-tls
          secret:
            secretName: {{ $raft.tlsSecret }}
        {{- if $raft.automaticBootstrap }}
        - name: admin-socket
          emptyDir: {}
        {{- end }}
        {{- if $dss.conf.pubKeys }}
        {{- include "public-certs:volume" (dict "cockroachdbEnabled" false) | nindent 8 }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: raft-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if $raft.storage.storageClass }}
        storageClassName: {{ $raft.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $raft.storage.size }}
{{- end }}
