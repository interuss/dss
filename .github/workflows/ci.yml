name: Continuous integration
on:
  pull_request: # All
  push:
    branches:
    - master
jobs:
  hygiene-tests:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
    - name: Job information
      run: |
        echo "Job information"
        echo "Trigger: ${{ github.event_name }}"
        echo "Host: ${{ runner.os }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        docker images
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Python lint
      run: make python-lint
    - name: Automated hygiene verification
      run: make hygiene
    - name: Shell lint
      run: make shell-lint
    - name: Go lint
      run: make go-lint
    - name: Terraform lint
      run: make terraform-lint
    - name: Ensure files don't change when generating apis
      run: |
        git diff --exit-code -- '*.gen.go'  # Should not have been changed by previous steps
        make apis
        git diff --exit-code -- '*.gen.go'  # Should not have been changed my make apis
    - name: Ensure files don't change when generating protos
      run: |
        git diff --exit-code -- '*.pb.go'  # Should not have been changed by previous steps
        make protos
        git diff --exit-code -- '*.pb.go'  # Should not have been changed by make protos
    - name: Ensure files don't change when running hygiene
      run: |
        git diff --exit-code

  dss-tests:
    name: DSS tests
    runs-on: ubuntu-latest
    steps:
    # See https://github.com/golang/go/issues/75031, can be removed when fixed
    - name: Set go tool chain version
      run: go env -w GOTOOLCHAIN=go1.25.5+auto
    - name: Job information
      run: |
        echo "Job information"
        echo "Trigger: ${{ github.event_name }}"
        echo "Host: ${{ runner.os }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        docker images
        go env
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Deployment infrastructure tests
      run: make evaluate-tanka
    - name: Go unit tests
      run: make test-go-units
    - name: Go unit tests with CockroachDB
      run: make test-go-units-crdb
    - name: Build dss image
      run: make build-dss
    - name: Tear down any pre-existing local DSS instance
      run: make down-locally
    - name: Start local DSS instance
      run: make start-locally
    - name: Probe local DSS instance
      run: make probe-locally
    - name: Run Qualifier against local DSS instance
      run: make qualify-locally
    - name: Run evict tests against local DSS instance
      run: make evict-locally
    - name: Run security tests against local DSS instance
      run: make security-locally
    - name: Bring down local DSS instance
      run: make down-locally
    - name: Collect coverage data
      run: make coverage-report-go
    - name: Save coverage data
      if: startsWith(github.ref, 'refs/heads/master')
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data
        path: coverage.out

  dss-tests-matrix:
    name: DSS tests (${{ matrix.db }} ${{ matrix.flags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [crdb, yugabyte]
        flags:
          - ""
          - "-enable_time_based_notification_index"
          - "-enable_scd_global_lock"
          - "-enable_scd_hash_lock"
        exclude:
          - db: crdb
            flags: ""
        # Raft does not support the flags above as it executes requests sequentially.
        include:
          - db: raft
            flags: ""
          - db: raft-cluster
            flags: ""
    env:
      COMPOSE_PROFILES: ${{ matrix.db == 'yugabyte' && 'with-yugabyte' || matrix.db == 'raft' && 'with-raft' || '' }}
      CORE_SERVICE_EXTRA_FLAGS: ${{ matrix.flags }}
    steps:
      - name: Job information
        run: |
          echo "Job information"
          echo "Trigger: ${{ github.event_name }}"
          echo "Host: ${{ runner.os }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          docker images
          go env
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build dss image
        run: make build-dss
      - name: Deploy a 3-node raft cluster
        if: matrix.db == 'raft-cluster'
        run: |
          echo "LOCAL_RUN_SCRIPT=build/dev/ci_infra/run_locally.sh" >> "$GITHUB_ENV"
          echo "NUM_USS=3" >> "$GITHUB_ENV"
          echo "CORE_SERVICE_CONTAINER=ci_infra_1-1-dss_loadbalancer-1" >> "$GITHUB_ENV"
          echo "OAUTH_CONTAINER=ci_infra_1-1-oauth-1" >> "$GITHUB_ENV"
          echo "DSS_DOCKER_NETWORK=interop_ecosystem_network" >> "$GITHUB_ENV"
      - name: Tear down any pre-existing local DSS instance
        run: make down-locally
      - name: Start local DSS instance
        run: make start-locally
      - name: Probe local DSS instance
        run: make probe-locally
      - name: Run Qualifier against local DSS instance
        run: make qualify-locally
      # Todo: Re-enable evict tests for raft once evict is implemented there.
      - name: Run evict tests against local DSS instance
        if: matrix.db != 'raft' && matrix.db != 'raft-cluster'
        run: make evict-locally
      - name: Run security tests against local DSS instance
        run: make security-locally
      - name: Dump raft cluster logs
        if: always() && matrix.db == 'raft-cluster'
        run: |
          mkdir -p raft-cluster-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^ci_infra_' || true); do
            docker logs "$c" > "raft-cluster-logs/${c}.log" 2>&1 || true
          done
      - name: Upload raft cluster logs
        if: always() && matrix.db == 'raft-cluster'
        uses: actions/upload-artifact@v4
        with:
          name: raft-cluster-logs
          path: raft-cluster-logs
      - name: Bring down local DSS instance
        run: make down-locally

  certificates-management-tests:
    name: Certificate management tests
    runs-on: ubuntu-latest
    steps:
    - name: Job information
      run: |
        echo "Job information"
        echo "Trigger: ${{ github.event_name }}"
        echo "Host: ${{ runner.os }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        docker images
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Tests
      run: cd test/certificates-management/ && python test.py

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
    - name: Job information
      run: |
        echo "Job information"
        echo "Trigger: ${{ github.event_name }}"
        echo "Host: ${{ runner.os }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        docker images
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Check migrations
      run: ./test/migrations/up_and_down.sh
