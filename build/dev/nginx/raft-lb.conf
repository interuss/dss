events {}

http {
  upstream raft_cluster {
    server local-dss-core-service-1:8082;
    server local-dss-core-service-2:8082;
    server local-dss-core-service-3:8082;
  }

  server {
    listen 8082;

    location / {
      proxy_pass http://raft_cluster;
      proxy_set_header Host $host;
    }

    location /healthy {
      return 200 'ok';
    }
  }
}
