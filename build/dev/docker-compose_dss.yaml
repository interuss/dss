# Brings up a full stand-alone DSS sandbox environment with locally-built dss
# and dummy-oauth InterUSS images.

# To bring up this system, see standalone_instance.md.

services:

  local-dss-crdb:
    image: cockroachdb/cockroach:v24.1.3
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    restart: always
    networks:
      - dss_sandbox_default_network
    healthcheck:
      test: curl -f 'http://localhost:8080/health?ready=1' || exit 1
      interval: 3m
      start_period: 30s
      start_interval: 5s

  local-dss-ybdb:
    image: yugabytedb/yugabyte:2.25.2.0-b359
    # ysql_output_buffer_size needs to be increased to allow ysql to retry read restart errors. https://docs.yugabyte.com/preview/reference/configuration/yb-tserver/#ysql-output-buffer-size
    command: bin/yugabyted start --background=false --tserver_flags="ysql_output_buffer_size=1048576"
    ports:
      - "7000:7000"
      - "9000:9000"
      - "15433:15433"
      - "5433:5433"
      - "9042:9042"
    restart: always
    networks:
      - dss_sandbox_default_network
    profiles: ["with-yugabyte"]
    healthcheck:
      test: ["CMD", "/home/yugabyte/postgres/bin/pg_isready", "-h", "local-dss-ybdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  local-dss-rid-bootstrapper-ybdb:
    image: interuss-local/dss
    command: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/yugabyte/rid --db_version "latest" --datastore_host local-dss-ybdb --datastore_user yugabyte --datastore_port 5433
    depends_on:
      local-dss-ybdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network
    profiles: ["with-yugabyte"]

  local-dss-scd-bootstrapper-ybdb:
    image: interuss-local/dss
    entrypoint: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/yugabyte/scd --db_version "latest" --datastore_host local-dss-ybdb --datastore_user yugabyte --datastore_port 5433
    depends_on:
      local-dss-ybdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network
    profiles: ["with-yugabyte"]

  local-dss-aux-bootstrapper-ybdb:
    image: interuss-local/dss
    entrypoint: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/yugabyte/aux_ --db_version "latest" --datastore_host local-dss-ybdb --datastore_user yugabyte --datastore_port 5433
    depends_on:
      local-dss-ybdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network
    profiles: ["with-yugabyte"]

  local-dss-rid-bootstrapper:
    image: interuss-local/dss
    command: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/rid --db_version "latest" --datastore_host local-dss-crdb
    depends_on:
      local-dss-crdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network

  local-dss-scd-bootstrapper:
    image: interuss-local/dss
    entrypoint: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/scd --db_version "latest" --datastore_host local-dss-crdb
    depends_on:
      local-dss-crdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network

  local-dss-aux-bootstrapper:
    image: interuss-local/dss
    entrypoint: /usr/bin/db-manager migrate --schemas_dir=/db-schemas/aux_ --db_version "latest" --datastore_host local-dss-crdb
    depends_on:
      local-dss-crdb:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network

  local-dss-core-service:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
          # Enable coverage tracking on local builds. Note GOCOVERDIR
          # must be set at runtime to an existing and writeable directory
          # for coverage data to be written upon exit.
          EXTRA_GO_INSTALL_FLAGS: "-cover"
    image: interuss-local/dss
    volumes:
      - $PWD/../test-certs:/var/test-certs:ro
      - $PWD/startup/core_service.sh:/startup/core_service.sh:ro
      - $PWD/startup/coverdata:/startup/coverdata:rw  # we will save coverage info here
      - raftdata:/raftdata
      - adminsocket:/run/dss
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      RAFT_PEER_URL: http://local-dss-core-service:9011
      # Note: requires the Dockerfile to have been built with "-cover" in the EXTRA_GO_INSTALL_FLAGS var
      GOCOVERDIR: "/startup/coverdata"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://local-dss-jaeger:4317}
      CORE_SERVICE_EXTRA_FLAGS: ${CORE_SERVICE_EXTRA_FLAGS-}
    command: /startup/core_service.sh ${DEBUG_ON:-0}
    ports:
      - "4000:4000"
      - "8082:8082"
    depends_on:
      local-dss-rid-bootstrapper:
        condition: service_completed_successfully
      local-dss-scd-bootstrapper:
        condition: service_completed_successfully
      local-dss-aux-bootstrapper:
        condition: service_completed_successfully
      local-dss-rid-bootstrapper-ybdb:
        condition: service_completed_successfully
        required: false
      local-dss-scd-bootstrapper-ybdb:
        condition: service_completed_successfully
        required: false
      local-dss-aux-bootstrapper-ybdb:
        condition: service_completed_successfully
        required: false
      local-dss-jaeger:
        condition: service_started
        required: false
    networks:
      - dss_sandbox_default_network
    healthcheck:
      test: wget -O - 'http://localhost:8082/healthy' || exit 1
      interval: 3m
      start_period: 30s
      start_interval: 5s
    profiles: ["", "with-yugabyte", "with-monitoring", "with-raft", "with-raft-cluster"]

  local-dss-core-service-2:
    image: interuss-local/dss
    volumes:
      - $PWD/../test-certs:/var/test-certs:ro
      - $PWD/startup/core_service.sh:/startup/core_service.sh:ro
      - raftdata2:/raftdata
      - adminsocket2:/run/dss
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      RAFT_NODE_ID: 2
      RAFT_PEER_URL: http://local-dss-core-service-2:9011
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://local-dss-jaeger:4317}
      CORE_SERVICE_EXTRA_FLAGS: ${CORE_SERVICE_EXTRA_FLAGS-}
    command: /startup/core_service.sh 0
    ports:
      - "8083:8082"
    networks:
      - dss_sandbox_default_network
    profiles: ["with-raft-cluster"]

  local-dss-core-service-3:
    image: interuss-local/dss
    volumes:
      - $PWD/../test-certs:/var/test-certs:ro
      - $PWD/startup/core_service.sh:/startup/core_service.sh:ro
      - raftdata3:/raftdata
      - adminsocket3:/run/dss
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      RAFT_NODE_ID: 3
      RAFT_PEER_URL: http://local-dss-core-service-3:9011
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://local-dss-jaeger:4317}
      CORE_SERVICE_EXTRA_FLAGS: ${CORE_SERVICE_EXTRA_FLAGS-}
    command: /startup/core_service.sh 0
    ports:
      - "8084:8082"
    networks:
      - dss_sandbox_default_network
    profiles: ["with-raft-cluster"]

  # Forms the Raft groups of the core services, which wait for them on their first start and only become healthy once
  # they are formed. It shares the directory of the Unix socket on which each core service serves its admin API.
  local-dss-raft-bootstrapper:
    image: interuss-local/dss
    entrypoint: /startup/raft_bootstrapper.sh
    volumes:
      - $PWD/startup/raft_bootstrapper.sh:/startup/raft_bootstrapper.sh:ro
      - adminsocket:/run/dss
      - adminsocket2:/run/dss2
      - adminsocket3:/run/dss3
    environment:
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
    depends_on:
      local-dss-core-service:
        condition: service_started
      local-dss-core-service-2:
        condition: service_started
        required: false
      local-dss-core-service-3:
        condition: service_started
        required: false
    networks:
      - dss_sandbox_default_network
    profiles: ["with-raft", "with-raft-cluster"]

  local-dss-dummy-oauth:
    build:
      context: ../..
      dockerfile: cmds/dummy-oauth/Dockerfile
    image: interuss-local/dummy-oauth
    command: -private_key_file /var/test-certs/auth2.key
    ports:
      - "8085:8085"
    networks:
      - dss_sandbox_default_network
    healthcheck:
      test: wget -O - 'http://localhost:8085/token?intended_audience=-&scope=-' || exit 1
      interval: 3m
      start_period: 30s
      start_interval: 5s

  local-dss-jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - dss_sandbox_default_network
    profiles: ["with-monitoring"]

  local-dss-prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    volumes:
      - $PWD/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    depends_on:
      local-dss-core-service:
        condition: service_healthy
    networks:
      - dss_sandbox_default_network
    profiles: ["with-monitoring"]

  local-dss-grafana:
    image: grafana/grafana:13.0-ubuntu-slim
    ports:
      - "3000:3000"
    volumes:
      - $PWD/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - $PWD/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - $PWD/../../deploy/services/tanka/grafana_dashboards/dss.json:/var/lib/grafana/dashboards/dss.json:ro
      - $PWD/../../deploy/services/tanka/grafana_dashboards/raft.json:/var/lib/grafana/dashboards/raft.json:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dss.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      local-dss-prometheus:
        condition: service_started
    networks:
      - dss_sandbox_default_network
    profiles: ["with-monitoring"]

networks:
  dss_sandbox_default_network:
    name: dss_sandbox-default

volumes:
  local-dss-data:
  raftdata:
  raftdata2:
  raftdata3:
  adminsocket:
  adminsocket2:
  adminsocket3:
