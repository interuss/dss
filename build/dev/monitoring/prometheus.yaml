global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: dss
    static_configs:
      - targets:
          - local-dss-core-service:8079
          - local-dss-core-service-2:8079
          - local-dss-core-service-3:8079
    # Stable per-node identity, mirroring the pod_name label set by the K8s-Pods job in tanka/helm.
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: pod_name
